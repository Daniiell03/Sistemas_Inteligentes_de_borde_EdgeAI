# Punto de acceso del asistente Jarvis
#
# El equipo emite su propia red inalambrica. Los usuarios se conectan a ella
# y acceden al portal desde su navegador: no hay cliente que instalar ni
# enlace hacia internet. La ausencia de red externa deja de ser una
# afirmacion y pasa a ser una propiedad observable.
#
# IMPORTANTE: wlan0 no puede ser punto de acceso y cliente a la vez. Con
# este servicio activo, el equipo ya NO se conecta a redes externas. El
# acceso de desarrollo se hace conectandose a esta misma red (ssh a
# 192.168.4.1) o por cable.

interface=wlan0
driver=nl80211

# --- identificacion de la red --------------------------------------------
ssid=Jarvis-Aula
country_code=CR

# --- radio ----------------------------------------------------------------
# 2.4 GHz, canal 7. Se prefiere 2.4 GHz sobre 5 GHz por compatibilidad con
# cualquier dispositivo del aula y por alcance.
hw_mode=g
channel=7
ieee80211n=1
wmm_enabled=1

# --- seguridad ------------------------------------------------------------
# WPA2-PSK con AES. La clave debe cambiarse antes de cualquier uso real:
# este archivo esta versionado.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=jarvis2026

# --- comportamiento -------------------------------------------------------
# La red es visible: los usuarios deben poder encontrarla sin instrucciones.
ignore_broadcast_ssid=0

# Los clientes pueden verse entre si. En un aula no hay razon para aislarlos
# y el aislamiento complica el diagnostico.
ap_isolate=0

max_num_sta=20
