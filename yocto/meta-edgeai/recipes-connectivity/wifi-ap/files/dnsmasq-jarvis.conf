# Asignacion de direcciones para la red del asistente Jarvis
#
# Los clientes que se conectan a la red del equipo reciben una direccion
# automaticamente y resuelven el nombre del portal sin configuracion.

# --- alcance --------------------------------------------------------------
# Solo atiende la interfaz del punto de acceso. Nunca responde por otras
# interfaces ni escucha en el exterior.
interface=wlan0
bind-interfaces
except-interface=lo

# --- asignacion de direcciones -------------------------------------------
# El equipo es 192.168.4.1. Los clientes reciben de .10 a .30, suficiente
# para un aula, con concesiones de doce horas.
dhcp-range=192.168.4.10,192.168.4.30,255.255.255.0,12h
dhcp-option=option:router,192.168.4.1
dhcp-option=option:dns-server,192.168.4.1

# --- resolucion de nombres -----------------------------------------------
# El portal responde en http://jarvis sin que el usuario escriba una IP.
address=/jarvis/192.168.4.1
address=/jarvis.local/192.168.4.1

# No hay servidores de nombres externos que consultar: el equipo no tiene
# salida a internet y cualquier consulta hacia afuera solo generaria esperas.
no-resolv
no-hosts
domain-needed
bogus-priv

# --- registro -------------------------------------------------------------
# Las concesiones viven en memoria: el medio de arranque no se escribe.
dhcp-leasefile=/run/dnsmasq/dnsmasq.leases
log-dhcp
